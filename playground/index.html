<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>言律语言 Playground</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'SimHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .nav {
            background: #f8f9fa;
            padding: 15px 30px;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            justify-content: center;
            gap: 30px;
        }
        
        .nav a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            padding: 8px 20px;
            border-radius: 5px;
            transition: all 0.3s;
        }
        
        .nav a:hover {
            background: #667eea;
            color: white;
        }

        .main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 30px;
        }

        .panel {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
        }

        .panel-header {
            background: #f5f5f5;
            padding: 15px;
            font-weight: bold;
            border-bottom: 1px solid #e0e0e0;
        }

        .panel-content {
            padding: 15px;
        }

        textarea {
            width: 100%;
            height: 300px;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            resize: vertical;
        }

        .output {
            background: #f8f8f8;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            min-height: 300px;
            font-family: 'Consolas', 'Monaco', monospace;
            white-space: pre-wrap;
            overflow-x: auto;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-run {
            background: #667eea;
            color: white;
        }

        .btn-run:hover {
            background: #5568d3;
        }

        .btn-analyze {
            background: #764ba2;
            color: white;
        }

        .btn-analyze:hover {
            background: #653a8b;
        }

        .btn-clear {
            background: #f0f0f0;
            color: #333;
        }

        .btn-clear:hover {
            background: #e0e0e0;
        }

        .examples {
            margin-top: 20px;
        }

        .example-btn {
            background: #e8f4f8;
            color: #333;
            margin: 5px;
            padding: 8px 15px;
            font-size: 12px;
        }

        .example-btn:hover {
            background: #d0e8f0;
        }

        .stats {
            margin-top: 15px;
            padding: 10px;
            background: #f0f8ff;
            border-radius: 4px;
            font-size: 12px;
        }

        .token-list {
            margin-top: 15px;
        }

        .token {
            display: inline-block;
            margin: 3px;
            padding: 5px 10px;
            background: #f0f0f0;
            border-radius: 3px;
            font-size: 12px;
        }

        .token-type {
            color: #667eea;
            font-weight: bold;
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .main {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>言律语言 Playground</h1>
            <p>中文编程语言在线体验平台</p>
        </div>
        
        <div class="nav">
            <a href="index.html">🏠 首页</a>
            <a href="builtins.html">📖 内置函数</a>
            <a href="stdlib.html">📚 标准库</a>
            <a href="examples.html">💡 示例</a>
        </div>

        <div class="main">
            <div class="panel">
                <div class="panel-header">代码编辑器</div>
                <div class="panel-content">
                    <textarea id="code" placeholder="在这里输入言律语言代码...">输出 "你好，言律语言！"
定义 变量 x 为 10
输出 x</textarea>

                    <div class="buttons">
                        <button class="btn-run" onclick="runCode()">运行代码</button>
                        <button class="btn-analyze" onclick="analyzeCode()">分析代码</button>
                        <button class="btn-clear" onclick="clearCode()">清空</button>
                    </div>

                    <div class="examples">
                        <strong>示例代码：</strong>
                        <button class="example-btn" onclick="loadExample(0)">Hello World</button>
                        <button class="example-btn" onclick="loadExample(1)">变量定义</button>
                        <button class="example-btn" onclick="loadExample(2)">条件程序块</button>
                        <button class="example-btn" onclick="loadExample(3)">循环程序块</button>
                        <button class="example-btn" onclick="loadExample(4)">函数程序块</button>
                        <button class="example-btn" onclick="loadExample(5)">嵌套程序块</button>
                        <button class="example-btn" onclick="loadExample(6)">复杂多语句</button>
                        <button class="example-btn" onclick="loadExample(7)">多程序块组合</button>
                        <button class="example-btn" onclick="loadExample(8)">函数与循环</button>
                        <button class="example-btn" onclick="loadExample(9)">完整程序</button>
                        <button class="example-btn" onclick="loadExample(10)">汉诺塔</button>
                        <button class="example-btn" onclick="loadExample(11)">数组操作</button>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">输出结果</div>
                <div class="panel-content">
                    <div id="output" class="output">等待执行...</div>
                    <div id="stats" class="stats" style="display:none;"></div>
                    <div id="tokens" class="token-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '';

        const examples = [
            '输出"你好，言律语言！"',
            '定义变量x为10\n输出x',
            '如果条件成立则\n    输出"条件为真"\n    输出"执行完成"',
            '循环5次执行\n    定义变量x为10\n    输出x\n    输出"循环一次"',
            '函数计算平方参数n\n    定义变量result为0\n    返回result\n输出"函数已定义"',
            '如果条件1成立则\n    如果条件2成立则\n        输出"两个条件都成立"\n    输出"第一个条件成立"',
            '定义变量count为0\n循环3次执行\n    定义变量temp为10\n    输出temp\n    如果条件成立则\n        输出"条件满足"\n输出"程序结束"',
            '定义变量x为5\n如果x大于0则\n    输出"正数"\n    循环x次执行\n        输出"循环"\n否则\n    输出"非正数"',
            '函数打印多次参数text count\n    循环count次执行\n        输出text\n输出"函数已定义"',
            '定义变量total为0\n定义变量i为1\n循环10次执行\n    定义变量temp为i\n    输出temp\n输出"计算完成"\n输出total',
            '函数汉诺塔参数n from to aux\n    如果n等于1则\n        输出"移动盘子"\n        输出from\n        输出"到"\n        输出to\n    否则\n        调用汉诺塔参数n-1 from aux to\n        输出"移动盘子"\n        输出from\n        输出"到"\n        输出to\n        调用汉诺塔参数n-1 aux to from\n输出"汉诺塔算法已定义"\n调用汉诺塔参数3 A C B',
            '定义变量arr为[5,3,8,1,2]\n输出"原始数组:"\n输出arr\n输出"访问元素:"\n输出arr[0]\n输出arr[1]\n输出arr[2]\n输出arr[3]\n输出arr[4]'
        ];

        function loadExample(index) {
            document.getElementById('code').value = examples[index];
        }

        async function runCode() {
            const code = document.getElementById('code').value;
            const output = document.getElementById('output');
            const stats = document.getElementById('stats');
            const tokens = document.getElementById('tokens');

            output.textContent = '执行中...';
            output.classList.add('loading');

            try {
                const response = await fetch(`${API_BASE}/api/run`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({code})
                });

                const data = await response.json();

                if (data.success) {
                    output.textContent = data.output;
                    stats.style.display = 'block';
                    stats.innerHTML = `
                        <strong>统计信息：</strong>
                        词元数: ${data.stats.tokens} |
                        行数: ${data.stats.lines} |
                        执行时间: ${data.stats.exec_time}ms |
                        变量数: ${data.stats.variables}
                    `;
                    tokens.innerHTML = '';
                } else {
                    output.textContent = '错误: ' + data.error;
                    stats.style.display = 'none';
                }
            } catch (error) {
                output.textContent = '网络错误: ' + error.message;
            }

            output.classList.remove('loading');
        }

        async function analyzeCode() {
            const code = document.getElementById('code').value;
            const output = document.getElementById('output');
            const stats = document.getElementById('stats');
            const tokens = document.getElementById('tokens');

            output.textContent = '分析中...';
            output.classList.add('loading');

            try {
                const response = await fetch(`${API_BASE}/api/analyze`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({code})
                });

                const data = await response.json();

                if (data.success) {
                    output.textContent = `分析完成，共 ${data.total_tokens} 个词元`;

                    stats.style.display = 'block';
                    stats.innerHTML = `<strong>总词元数：</strong>${data.total_tokens}`;

                    tokens.innerHTML = '<strong>词元列表：</strong><br>';
                    data.tokens.forEach(token => {
                        tokens.innerHTML += `
                            <span class="token">
                                <span class="token-type">${token.type}</span>: "${token.value}"
                            </span>
                        `;
                    });
                } else {
                    output.textContent = '错误: ' + data.error;
                    stats.style.display = 'none';
                    tokens.innerHTML = '';
                }
            } catch (error) {
                output.textContent = '网络错误: ' + error.message;
            }

            output.classList.remove('loading');
        }

        function clearCode() {
            document.getElementById('code').value = '';
            document.getElementById('output').textContent = '等待执行...';
            document.getElementById('stats').style.display = 'none';
            document.getElementById('tokens').innerHTML = '';
        }
    </script>
</body>
</html>
