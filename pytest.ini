[pytest]
# pytest配置文件

# 测试路径
testpaths = 
    src/yanlv/lexer
    src/yanlv/feedback
    tests

# Python文件模式
python_files = test_*.py *_test.py

# Python类模式
python_classes = Test*

# Python函数模式
python_functions = test_*

# 命令行选项
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=yanlv
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml

# 标记
markers =
    slow: 慢速测试
    integration: 集成测试
    unit: 单元测试

# 覆盖率配置
[coverage:run]
source = yanlv
omit = 
    */tests/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod