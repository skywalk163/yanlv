[pytest]
# pytest配置文件

# 测试路径
testpaths = 
    src/yanlv/lexer
    src/yanlv/feedback
    src/yanlv/error_handling
    tests

# Python文件模式 - 只收集test_*.py文件
python_files = test_*.py

# Python类模式
python_classes = Test*

# Python函数模式
python_functions = test_*

# 命令行选项
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=yanlv
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml

# 忽略的文件
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    .pytest_cache
    .mypy_cache
    .venv
    venv

# 标记
markers =
    slow: 慢速测试
    integration: 集成测试
    unit: 单元测试

# 覆盖率配置
[coverage:run]
source = yanlv
omit = 
    */tests/*
    */__pycache__/*
    */site-packages/*
    */lexer_backup.py
    */lexer_clean.py
    */lexer_new.py
    */lexer_original_backup.py
    */lexer_simple.py
    */demo_*.py
    */examples.py
    */fix_imports.py
    */rename_token.py
    */verb_categories*.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod